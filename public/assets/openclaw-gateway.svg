      <text x="390" y="374" fill="#141413" font-size="12" font-weight="500" font-family="'TsangerJinKai02', 'Source Han Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif" text-anchor="middle">本地记忆</text>
      <text x="390" y="389" fill="#504e49" font-size="9" font-family="'TsangerJinKai02', 'Source Han Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif" text-anchor="middle">~/ Markdown 文件</text>

      <!-- Legend -->
      <line x1="40" y1="420" x2="920" y2="420" stroke="#DEDED7" stroke-width="0.8"/>
      <rect x="40" y="436" width="14" height="10" rx="2" fill="#EEF2F7" stroke="#1B365D" stroke-width="1"/>
      <text x="60" y="444" fill="#504e49" font-size="8.5" font-family="'TsangerJinKai02', 'Source Han Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif">焦点：网关（单一真相源）</text>
      <rect x="320" y="436" width="14" height="10" rx="2" fill="#E9E8E1" stroke="#6b6a64" stroke-width="1"/>
      <text x="340" y="444" fill="#504e49" font-size="8.5" font-family="'TsangerJinKai02', 'Source Han Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif">外部渠道</text>
      <text x="500" y="444" fill="#504e49" font-size="8.5" font-family="'TsangerJinKai02', 'Source Han Serif SC', 'Noto Serif CJK SC', 'Songti SC', serif">蓝线：网关向各 agent 会话路由并隔离</text>
