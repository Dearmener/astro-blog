      <line x1="480" y1="224" x2="616" y2="160" stroke="#1B365D" stroke-width="1.4" marker-end="url(#arrB)"/>
      <line x1="480" y1="248" x2="616" y2="316" stroke="#1B365D" stroke-width="1.4" marker-end="url(#arrB)"/>
      <line x1="390" y1="272" x2="390" y2="332" stroke="#504e49" stroke-width="1.2" marker-end="url(#arr)"/>

      <!-- 箭头标签（垫底色防穿线） -->
      <rect x="208" y="216" width="64" height="12" rx="2" fill="#f5f4ed"/>
